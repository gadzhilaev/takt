# Takt edge vhost for portfolio nginx (gadzhilaev-nginx-1).
# Install: /etc/takt/nginx/edge.conf → mounted as /etc/nginx/conf.d/taktapp.conf
#
# Containers on gadzhilaev_internal:
#   takt-backend:8000
#   takt-frontend:3000

# ─── HTTP: ACME + redirect ───
server {
  listen 80;
  listen [::]:80;
  server_name taktapp.ru www.taktapp.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://taktapp.ru$request_uri;
  }
}

# ─── www → apex ───
server {
  listen 443 ssl;
  http2 on;
  server_name www.taktapp.ru;

  ssl_certificate     /etc/letsencrypt/live/taktapp.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taktapp.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    return 301 https://taktapp.ru$request_uri;
  }
}

# ─── HTTPS app ───
server {
  listen 443 ssl;
  http2 on;
  server_name taktapp.ru;

  ssl_certificate     /etc/letsencrypt/live/taktapp.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taktapp.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  location /api/ {
    set $takt_api http://takt-backend:8000;
    proxy_pass $takt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location /ws {
    set $takt_api http://takt-backend:8000;
    proxy_pass $takt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    set $takt_web http://takt-frontend:3000;
    proxy_pass $takt_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
