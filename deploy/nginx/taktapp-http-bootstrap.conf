# Temporary HTTP-only vhost for ACME before certificates exist.
server {
  listen 80;
  listen [::]:80;
  server_name taktapp.ru www.taktapp.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 200 'Takt edge bootstrap\n';
    add_header Content-Type text/plain;
  }
}
