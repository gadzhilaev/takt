name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: track
          POSTGRES_PASSWORD: track_dev_pass
          POSTGRES_DB: track_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U track -d track_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Ruff (critical)
        # Полный стиль (E/I) ещё не вычищен по репо; в CI ловим undefined/syntax.
        run: .venv/bin/ruff check app tests --select F821,F822,E9
      - name: Pytest
        env:
          ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
        run: .venv/bin/pytest -q

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
